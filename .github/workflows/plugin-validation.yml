# Validates both plugin bundles (Claude Code + Cursor) on any change to the
# bundled artifacts, the validators themselves, or the bundlers that generate
# them. TAP-7756 — neither validator was invoked by any workflow before this.
#
# scripts/validate-claude-plugin.sh delegates schema checks to
# `claude plugin validate --strict` and deliberately exits 3 when the
# `claude` CLI is not on PATH, so a runner that skipped installing it would
# fail loudly rather than pass silently. This job installs the CLI
# explicitly from the published npm package rather than letting that step
# be skipped or made conditional.
name: Plugin Validation

on:
  push:
    paths:
      - "plugin/**"
      - "scripts/validate-claude-plugin.sh"
      - "scripts/validate-cursor-plugin.sh"
      - "scripts/test-validate-claude-plugin-deps.sh"
      - "scripts/test-validate-claude-plugin-prefix-resolvability.sh"
      - "scripts/test-validate-claude-plugin-hook-wiring.sh"
      - "packages/tapps-mcp/src/tapps_mcp/cli_ops_build.py"
      - "packages/tapps-mcp/src/tapps_mcp/pipeline/platform_bundles.py"
      - ".github/workflows/plugin-validation.yml"
  pull_request:
    branches: [master]
    paths:
      - "plugin/**"
      - "scripts/validate-claude-plugin.sh"
      - "scripts/validate-cursor-plugin.sh"
      - "scripts/test-validate-claude-plugin-deps.sh"
      - "scripts/test-validate-claude-plugin-prefix-resolvability.sh"
      - "scripts/test-validate-claude-plugin-hook-wiring.sh"
      - "packages/tapps-mcp/src/tapps_mcp/cli_ops_build.py"
      - "packages/tapps-mcp/src/tapps_mcp/pipeline/platform_bundles.py"
      - ".github/workflows/plugin-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-claude-plugin:
    name: Validate Claude Code plugin bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Confirm claude CLI is on PATH (fail loudly, not silently)
        run: claude --version

      - name: Validate plugin/claude bundle
        run: bash scripts/validate-claude-plugin.sh plugin/claude

      - name: Regression-test the dependency-resolvability check itself (TAP-7758)
        run: bash scripts/test-validate-claude-plugin-deps.sh

      # TAP-7756 wired only the deps harness, so the controls proving part (e)
      # actually discriminates had no invoker and ran only when somebody
      # remembered to. A control nothing invokes is not a control.
      - name: Regression-test the mcp__* prefix-resolvability check itself (TAP-7753)
        run: bash scripts/test-validate-claude-plugin-prefix-resolvability.sh

      # TAP-7754: section (c) proved only that a named script EXISTS. Two
      # defects lived on the other two sides of that -- a shipped script no
      # event referenced, and a command that named a real file but did not
      # resolve at runtime -- and both shipped while this workflow was green.
      - name: Regression-test the hook-wiring checks themselves (TAP-7754)
        run: bash scripts/test-validate-claude-plugin-hook-wiring.sh

  validate-cursor-plugin:
    name: Validate Cursor plugin bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate plugin/cursor bundle
        run: bash scripts/validate-cursor-plugin.sh plugin/cursor
