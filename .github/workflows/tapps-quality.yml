# TappsMCP quality gate for tapps-mcp dev repo (EPIC-113 / TAP-4022).
# Validates changed Python files on pull requests via the same pipeline agents use locally.
name: TappsMCP Quality Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - "packages/**/*.py"
      - "packages/**/pyproject.toml"
      - "pyproject.toml"
      - ".tapps-mcp.yaml"
      - ".github/workflows/tapps-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tapps-quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: validate-changed (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --all-packages --group dev

      - name: Run TappsMCP quality gate on changed Python files
        env:
          TAPPS_MCP_PROJECT_ROOT: ${{ github.workspace }}
          # Keep in sync with tapps_mcp.tools.batch_validator.MAX_BATCH_FILES
          TAPPS_VALIDATE_BATCH_SIZE: "50"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
            # TAP-6904: ratchet against the PR's merge target so a PR that
            # improves (or holds) an already-below-threshold file can pass
            # instead of deadlocking on a threshold no honest PR could clear.
            BASELINE_REF="${{ github.event.pull_request.base.sha }}"
          else
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            RANGE="origin/${DEFAULT_BRANCH}...HEAD"
            # No PR base on a non-pull_request run -- ratchet stays off.
            BASELINE_REF=""
          fi
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "${RANGE}" -- \
              '*.py' '*.pyi' \
              | sort -u
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files to validate."
            exit 0
          fi
          BATCH_SIZE="${TAPPS_VALIDATE_BATCH_SIZE}"
          TOTAL="${#FILES[@]}"
          BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "Validating ${TOTAL} changed Python file(s) in ${BATCHES} batch(es) of ≤${BATCH_SIZE}"
          status=0
          for ((i = 0; i < TOTAL; i += BATCH_SIZE)); do
            chunk=("${FILES[@]:i:BATCH_SIZE}")
            csv=$(IFS=,; echo "${chunk[*]}")
            batch_num=$(( i / BATCH_SIZE + 1 ))
            echo "::group::validate-changed batch ${batch_num}/${BATCHES} (${#chunk[@]} files)"
            BASELINE_ARGS=()
            if [ -n "${BASELINE_REF}" ]; then
              BASELINE_ARGS=(--baseline-ref "${BASELINE_REF}")
            fi
            if ! uv run tapps-mcp validate-changed --quick --file-paths "${csv}" "${BASELINE_ARGS[@]}"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  agent-contract:
    name: agent contract + skills stamp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --all-packages --group dev

      - name: Agent contract golden-string tests
        run: |
          uv run pytest \
            packages/tapps-mcp/tests/unit/test_agent_contract.py \
            packages/tapps-mcp/tests/unit/test_hint_string_consistency.py \
            -q

      - name: Validate TAPPS skill frontmatter (source templates)
        run: uv run pytest packages/tapps-mcp/tests/unit/test_platform_skills.py::TestSkillsSpecValidator -q

      - name: AGENTS.md version stamp
        run: uv run tapps-mcp check-agents-md-stamp --project-root .

      - name: Version pins in sync (bump-versions --check)
        run: python3 scripts/bump-versions.py --check
