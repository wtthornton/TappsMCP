# TappsMCP quality gate for tapps-mcp dev repo (EPIC-113 / TAP-4022).
# Validates changed Python files on pull requests via the same pipeline agents use locally.
name: TappsMCP Quality Gate

on:
  pull_request:
    branches: [main, master]
    paths:
      - "packages/**/*.py"
      - "packages/**/pyproject.toml"
      - "pyproject.toml"
      - "*.spec"
      - ".tapps-mcp.yaml"
      - ".github/workflows/tapps-quality.yml"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tapps-quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: validate-changed (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --all-packages --group dev

      - name: Run TappsMCP quality gate on changed Python files
        env:
          TAPPS_MCP_PROJECT_ROOT: ${{ github.workspace }}
          # Keep in sync with tapps_mcp.tools.batch_validator.MAX_BATCH_FILES
          TAPPS_VALIDATE_BATCH_SIZE: "50"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # TAP-6909: ratchet against the CURRENT tip of the merge-target
            # branch, not the PR-creation-time base sha -- a PR left open for
            # days would otherwise ratchet against a stale floor, and a diff
            # range anchored to that stale sha can select files the PR never
            # touched. Derive the tip live: checkout's fetch-depth:0 does not
            # guarantee a remote-tracking ref for the base branch exists.
            BASE_REF="${{ github.base_ref }}"
            if ! git fetch --force origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
              echo "::error::Could not fetch origin/${BASE_REF} -- refusing to guess a ratchet baseline." >&2
              exit 1
            fi
            BASELINE_REF="origin/${BASE_REF}"
            if ! MERGE_BASE="$(git merge-base "${{ github.sha }}" "${BASELINE_REF}")"; then
              echo "::error::Could not resolve a merge-base between ${{ github.sha }} and ${BASELINE_REF} -- refusing to guess a diff range." >&2
              exit 1
            fi
            # TAP-6904: ratchet against the merge target so a PR that
            # improves (or holds) an already-below-threshold file can pass
            # instead of deadlocking on a threshold no honest PR could clear.
            RANGE="${MERGE_BASE}..${{ github.sha }}"
          else
            # TAP-7450: on push, diff the commits GitHub actually pushed
            # (before..after) instead of origin/<default>...HEAD -- on a
            # push to the default branch, origin/<default> IS HEAD by the
            # time this job runs, so that range is always empty and the
            # job silently validates nothing.
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"
            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "${ZERO_SHA}" ]; then
              # New branch / first push -- no prior sha to diff against.
              # Validate just the tip commit.
              RANGE="${AFTER_SHA}~1..${AFTER_SHA}"
              BASELINE_REF="${AFTER_SHA}~1"
            elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "${BEFORE_SHA}" "${AFTER_SHA}"; then
              RANGE="${BEFORE_SHA}..${AFTER_SHA}"
              BASELINE_REF="${BEFORE_SHA}"
            else
              # Force-push (before sha isn't an ancestor of after, or was
              # rewritten out of history) -- before..after would be wrong
              # or huge, so fall back to validating just the tip commit.
              RANGE="${AFTER_SHA}~1..${AFTER_SHA}"
              BASELINE_REF="${AFTER_SHA}~1"
            fi
            # TAP-7817: the push path ratchets on the SAME hold-or-improve
            # policy as the PR path, against the previous commit on the
            # default branch -- the left edge of the range being diffed, i.e.
            # whatever the last merge left behind. That is the same baseline
            # the PR path resolves for the same change, so the two triggers
            # cannot return different verdicts on identical bytes. Leaving
            # BASELINE_REF empty here (as this path did until TAP-7817)
            # silently reverted push to the ABSOLUTE threshold: a PR passed
            # its own check and the identical job then failed on push, on the
            # same file, with no code change in between.
            if ! git rev-parse --verify --quiet "${BASELINE_REF}^{commit}" >/dev/null; then
              echo "::error::Could not resolve the push ratchet baseline ${BASELINE_REF} -- refusing to guess a ratchet baseline." >&2
              exit 1
            fi
          fi
          if [ -z "${BASELINE_REF}" ]; then
            # Every branch above sets a baseline. An empty one here would mean
            # silently gating on the absolute threshold instead -- exactly the
            # per-trigger policy split TAP-7817 removed. Fail loudly instead.
            echo "::error::No ratchet baseline resolved for event ${{ github.event_name }} -- refusing to fall back to the absolute threshold." >&2
            exit 1
          fi
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "${RANGE}" -- \
              '*.py' '*.pyi' \
              | sort -u
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files to validate."
            exit 0
          fi
          BATCH_SIZE="${TAPPS_VALIDATE_BATCH_SIZE}"
          TOTAL="${#FILES[@]}"
          BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))
          echo "Validating ${TOTAL} changed Python file(s) in ${BATCHES} batch(es) of ≤${BATCH_SIZE}"
          status=0
          for ((i = 0; i < TOTAL; i += BATCH_SIZE)); do
            chunk=("${FILES[@]:i:BATCH_SIZE}")
            csv=$(IFS=,; echo "${chunk[*]}")
            batch_num=$(( i / BATCH_SIZE + 1 ))
            echo "::group::validate-changed batch ${batch_num}/${BATCHES} (${#chunk[@]} files)"
            if ! uv run tapps-mcp validate-changed --quick --file-paths "${csv}" \
                 --baseline-ref "${BASELINE_REF}"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  unit-suite:
    # TAP-7234: 0 of the other jobs in this file run the whole tapps-mcp unit
    # suite -- `quality` above only validates changed files. Without this job,
    # a regression in an untouched file ships unnoticed (see PR #381, which
    # merged 9/9 green while nlt-build could not start).
    name: full unit suite (tapps-mcp)
    runs-on: ubuntu-latest
    # Measured locally: `pytest packages/tapps-mcp/tests/unit -q -n 4` = 119.05s
    # on a 20-core box. Timeout is that x3 (~6 min) plus checkout/uv-sync/
    # setup-python overhead observed in the sibling jobs in this file.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --all-packages --group dev

      - name: Run full tapps-mcp unit suite
        run: uv run pytest packages/tapps-mcp/tests/unit -q -p no:randomly -n 4

  agent-contract:
    name: agent contract + skills stamp
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --all-packages --group dev

      - name: Agent contract golden-string tests
        run: |
          uv run pytest \
            packages/tapps-mcp/tests/unit/test_agent_contract.py \
            packages/tapps-mcp/tests/unit/test_hint_string_consistency.py \
            -q

      - name: Validate TAPPS skill frontmatter (source templates)
        run: uv run pytest packages/tapps-mcp/tests/unit/test_platform_skills.py::TestSkillsSpecValidator -q

      - name: PyInstaller spec covers all project modules (TAP-6887)
        run: uv run pytest packages/tapps-mcp/tests/unit/test_pyinstaller_spec.py -q

      - name: AGENTS.md version stamp
        run: uv run tapps-mcp check-agents-md-stamp --project-root .

      - name: Version pins in sync (bump-versions --check)
        run: python3 scripts/bump-versions.py --check

  ps1-parse-check:
    # TAP-6737: nothing else in CI parses the generated .ps1 hook templates,
    # so a parse error (the PR 304 failure mode) can survive an all-green
    # run. ubuntu-latest ships pwsh, so this is the fix, not a new gap.
    name: powershell hook templates parse under pwsh
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workspace
        run: uv sync --all-packages --group dev

      - name: Render and parse every generated .ps1 hook template
        run: |
          set -euo pipefail
          uv run pytest -q -p no:randomly \
            packages/tapps-mcp/tests/unit/test_hook_script_syntax.py \
            -k ps1_template_parses -rs \
            | tee /tmp/ps1-template-parses.log
          skipped=$(grep -c "SKIPPED" /tmp/ps1-template-parses.log || true)
          if [ "${skipped}" -ne 0 ]; then
            echo "::error::${skipped} test_ps1_template_parses case(s) were SKIPPED on a pwsh-equipped runner -- the pwsh probe is broken." >&2
            exit 1
          fi

      - name: Run the ps1 Stop hook tests (must not skip on this runner)
        run: |
          set -euo pipefail
          uv run pytest -q -p no:randomly \
            packages/tapps-mcp/tests/unit/test_platform_hook_templates.py \
            -k ps1_stop_hook -rs \
            | tee /tmp/ps1-stop-hook.log
          skipped=$(grep -c "SKIPPED" /tmp/ps1-stop-hook.log || true)
          if [ "${skipped}" -ne 0 ]; then
            echo "::error::${skipped} ps1_stop_hook test(s) were SKIPPED on a pwsh-equipped runner -- the pwsh probe is broken." >&2
            exit 1
          fi
