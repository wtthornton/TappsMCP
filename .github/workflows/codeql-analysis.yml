# .github/workflows/codeql-analysis.yml
#
# CodeQL security scanning. This workflow was `disabled_manually` for ~the last
# 30 days (0 runs) while the file stayed in the tree, so the repo advertised
# security scanning it did not have. Re-enabled here.
#
# Cost: $0. TappsMCP is a public repository, and standard GitHub-hosted runners
# (`ubuntu-latest`) are free and unmetered on public repos — including the
# weekly scheduled run. Nothing in this file is billable. Keep it that way:
# scripts/check-ci-cost.py fails the build if a workflow adopts a metered
# runner. See docs/adr/0035-ci-cost-model-and-scope.md.
name: CodeQL Analysis

on:
  pull_request:
    branches: [main, master]
    paths:
      - "packages/**/*.py"
      - "packages/**/*.pyi"
      - "scripts/**/*.py"
      - ".github/workflows/codeql-analysis.yml"
  # Weekly full-tree scan on the default branch. This is what populates the
  # Security tab baseline (PR runs only annotate the diff) and re-runs newly
  # published CodeQL queries against code that has not changed.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # Python is interpreted: `build-mode: none` analyses source directly
          # and replaces the old `autobuild` step, which was a slow no-op here.
          build-mode: none
          # `security-extended` rather than `security-and-quality`: the quality
          # half duplicates ruff + pylint + mypy, which already gate every PR
          # via tapps-quality.yml. Extended keeps the wider security query set
          # without the redundant style noise.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
