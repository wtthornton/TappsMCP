# MCP guardrails: tool-budget lint, tool-description length budget, and
# response-envelope consistency.
# PR-only — checks already pass before merge; push re-runs were pure duplicate cost.
name: mcp-guardrails

on:
  pull_request:
    branches: [main, master]
    paths:
      - "packages/**/src/**"
      - "docs/architecture/tool-budget.md"
      - "docs/ARCHITECTURE.md"
      - "scripts/check-tool-budget.py"
      - "scripts/check-response-envelope.py"
      - "packages/tapps-mcp/tests/integration/test_tool_descriptions.py"
      - ".github/workflows/mcp-guardrails.yml"
      - "README.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-guardrails-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tool-budget:
    name: MCP tool-budget lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test check-tool-budget.py
        run: python3 scripts/check-tool-budget.py --test

      - name: Lint PR diff for new tools
        run: |
          python3 scripts/check-tool-budget.py \
            --diff-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --commit-msg "$(git log -1 --format='%B' ${{ github.event.pull_request.head.sha }})"

      # TAP-5611: the front-door tool counts drifted twice before anything
      # enforced them (TAP-4577 was the first).
      - name: Check documented tool counts against the registry
        run: python3 scripts/check-tool-budget.py --check-counts

  tool-descriptions:
    name: MCP tool-description budget
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --group dev

      - name: Run tool description budget test
        run: uv run --no-sync pytest packages/tapps-mcp/tests/integration/test_tool_descriptions.py -v

  # TAP-5660: two defects reached a consuming project reporting success while a
  # nested sub-result had failed. Reviewers do not reliably notice an absent
  # else-branch; a failing build does. No uv sync — the lint is stdlib-only and
  # runs in seconds.
  response-envelope:
    name: Response envelope consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-test check-response-envelope.py
        run: python3 scripts/check-response-envelope.py --test

      - name: Check responses for unexamined best-effort sub-results
        run: python3 scripts/check-response-envelope.py
