# NLT MCP Plugin Specification (zero-duplication split)
# Schema for tapps_init / tapps-mcp serve --profile / docsmcp serve --profile
#
# Research backing: Linear TAP-3889 / ADR-0016
# Related: docs/architecture/tool-budget.md, TOOL-TIER-RANKING.md
#
# Design rules:
#   - MCP server IDs use nlt-* prefix (tool names stay tapps_* / docs_*).
#   - Each tool registers on exactly ONE server (zero duplication).
#   - Cross-server workflows use skills + in-process Python imports, not duplicate registration.
#   - Target ≤20 tools per server; ≤9 eager tools per server (defer_loading for the rest).
#
# CORE ASSUMPTION (load-bearing):
#   Install/deploy default is the full bundle (all six servers) — ADR-0018.
#   Token-tight sessions opt DOWN via `mcp_bundle` in `.tapps-mcp.yaml` or
#   `tapps-mcp mcp-bundle set developer|minimal|…` (then reload MCP).
#   Doctor WARN thresholds still target partial enablement (≤3 servers).
#   Cursor catalogs all *listed* tools on enabled servers; eager counts are
#   Claude Tool Search math only (defer_loading does not shrink Cursor).

schema_version: "1.0"

# ---------------------------------------------------------------------------
# Core assumption: partial enablement (not all servers at once)
# ---------------------------------------------------------------------------
core_assumption:
  statement: |
    A typical session enables one task bundle (1–3 servers). Enabling all five
    simultaneously is unsupported as a default experience — it recreates monolith
    context cost (~78 tools, ~29 eager, ~10K+ schema tokens) without the benefit
    of the split.
  expected_sessions:
    daily_coding:
      servers: [nlt-build]
      optional: [nlt-memory, nlt-setup]
      eager_tools_approx: 9
    coding_with_memory:
      servers: [nlt-build, nlt-memory]
      eager_tools_approx: 11
    planning_linear:
      servers: [nlt-build, nlt-linear-issues]
      eager_tools_approx: 16
    docs_audit:
      servers: [nlt-project-docs]
      eager_tools_approx: 6
    release_day:
      servers: [nlt-release-ship, nlt-project-docs]
      eager_tools_approx: 11
    security_pass:
      servers: [nlt-build]
      eager_tools_approx: 9
    audit_campaign:
      servers: [nlt-build, nlt-linear-issues]
      eager_tools_approx: 16
    bootstrap_only:
      servers: [nlt-setup]
      eager_tools_approx: 2
  anti_pattern:
    name: all_five_enabled
    servers: all
    tools: 78
    eager_approx: 29
    guidance: |
      Avoid. Use only for power users or short diagnostic sessions. tapps_doctor
      should WARN when >3 nlt-* servers are enabled or eager total exceeds 20.
  init_defaults:
    write_all_servers: true # ADR-0018: all six nlt-* entries by default
    default_bundle: full # ADR-0018 supersedes ADR-0016 developer default
    opt_down_bundle: developer # token-tight: build+memory+linear (~39 listed / ~18 eager)
    comment_disabled_servers: false # deprecated — strict JSON; omit opt-outs (TAP-4811)
  prompts_and_resources:
    tapps_pipeline_prompts: nlt-build # _tapps_* + tapps://config/* — not memory/setup
    docs_workflow_prompts: nlt-project-docs # docs://* — not linear/release hitchhikers
plugin_id: nlt-tapps-plugin
plugin_display_name: "NLT Tapps Quality Plugin"
plugin_version: "1.0.0"

# ---------------------------------------------------------------------------
# Research-aligned constraints (2026)
# ---------------------------------------------------------------------------
constraints:
  max_tools_per_server: 20 # soft target; nlt-project-docs is 29 total / 0 eager — defer_loading required
  max_eager_tools_per_server: 9
  duplication_policy: zero # no tool name in more than one server profile
  tool_name_prefixes: # unchanged; server ID provides namespace via host (mcp__nlt-code-quality__...)
    tapps: tapps_
    docs: docs_

# ---------------------------------------------------------------------------
# Default bundles (what tapps_init writes to .cursor/mcp.json by default)
# ---------------------------------------------------------------------------
default_bundles:
  developer:
    description: "Daily coding (Build + Memory + Linear)"
    enabled_servers:
      - nlt-build
      - nlt-memory
      - nlt-linear-issues
  minimal:
    description: "Token-tight coding (Build only)"
    enabled_servers:
      - nlt-build
  memory:
    description: "Coding + recall/save/handoff (no Linear)"
    enabled_servers:
      - nlt-build
      - nlt-memory
  planning:
    description: "Coding + Linear issue workflow (no Memory MCP)"
    enabled_servers:
      - nlt-build
      - nlt-linear-issues
  docs:
    description: "Coding + project documentation"
    enabled_servers:
      - nlt-build
      - nlt-project-docs
  release:
    description: "Coding + release ship tools"
    enabled_servers:
      - nlt-build
      - nlt-release-ship
  security:
    description: "Security scan + CVE check on Build"
    enabled_servers:
      - nlt-build
  audit:
    description: "Audit campaign + Linear close loop"
    enabled_servers:
      - nlt-build
      - nlt-linear-issues
  full:
    description: "ADR-0018 deploy default — all six servers. Opt down with mcp-bundle set."
    enabled_servers:
      - nlt-build
      - nlt-memory
      - nlt-setup
      - nlt-linear-issues
      - nlt-project-docs
      - nlt-release-ship
    warn_in_doctor: false # intentional PASS when mcp_bundle=full (ADR-0018)

# ---------------------------------------------------------------------------
# MCP servers (6 — ADR-0016)
# ---------------------------------------------------------------------------
servers:
  nlt-build:
    display_name: "Build"
    tagline: "Score, gate, and secure code while you edit."
    package: tapps-mcp
    serve_command: tapps-mcp
    serve_args: ["serve", "--profile", "nlt-build"]
    legacy_profile_alias: nlt-code-quality
    default_enabled: true
    tool_count: 19
    eager_count: 9
    skills:
      - tapps-finish-task
      - tapps-review-pipeline
      - tapps-domain-security
      - tapps-domain-testing
      - tapps-domain-frontend
      - tapps-flow-develop
      - tapps-flow-review
      - tapps-flow-frontend
      - tapps-security
      - tapps-research
    hooks:
      - tapps-after-edit # Cursor: remind quick_check
      - tapps-post-edit # Claude: remind quick_check
    tools:
      eager:
        - tapps_session_start
        - tapps_quick_check
        - tapps_validate_changed
        - tapps_quality_gate
        - tapps_checklist
        - tapps_lookup_docs
        - tapps_score_file
        - tapps_security_scan
        - tapps_impact_analysis
      deferred:
        - tapps_research
        - tapps_usage
        - tapps_validate_config
        - tapps_dead_code
        - tapps_dependency_graph
        - tapps_dependency_scan
        - tapps_report
        - tapps_audit_campaign
        - tapps_call_graph
        - tapps_diff_impact
        - tapps_domain_playbook

  nlt-memory:
    display_name: "Memory"
    tagline: "Recall, save, and session continuity via tapps-brain."
    package: tapps-mcp
    serve_command: tapps-mcp
    serve_args: ["serve", "--profile", "nlt-memory"]
    default_enabled: false
    tool_count: 5
    eager_count: 2
    skills:
      - tapps-memory
      - tapps-handoff-session
    hooks: []
    tools:
      eager:
        - tapps_session_start # bootstrap routing (intentional dupe with build/setup)
        - tapps_memory
      deferred:
        - tapps_session_notes
        - tapps_session_end
        - tapps_handoff_save
    notes: |
      tapps_memory exposes search, save, get, health, related only (TAP-3895).
      Full 42-action catalog remains CLI-only (TAP-1994).
      No _tapps_* prompts / tapps:// resources (owned by nlt-build).

  nlt-linear-issues:
    display_name: "Linear Issues"
    tagline: "Create, lint, validate, and triage agent-ready Linear issues."
    package: tapps-platform # cross-package profile; combines tapps + docs handlers
    serve_command: tapps-platform
    serve_args: ["serve", "--profile", "nlt-linear-issues"]
    default_enabled: false
    tool_count: 15
    eager_count: 7
    skills:
      - linear-issue
      - linear-read
    hooks:
      - tapps-pre-linear-write
      - tapps-pre-linear-list
      - tapps-post-linear-list
      - tapps-post-linear-snapshot-get
    tools:
      eager:
        - docs_generate_epic
        - docs_generate_story
        - docs_lint_linear_issue
        - docs_validate_linear_issue
        - docs_save_linear_issue
        - tapps_linear_snapshot_get
        - tapps_finding_to_story
      deferred:
        - docs_generate_prompt
        - docs_linear_triage
        - docs_validate_epic
        - tapps_linear_snapshot_put
        - tapps_linear_snapshot_invalidate
        - tapps_linear_count
        - tapps_linear_list_issues
        - tapps_audit_close_coverage

  nlt-project-docs:
    display_name: "Project Docs"
    tagline: "Generate and audit project documentation from the codebase."
    package: docs-mcp
    serve_command: docsmcp
    serve_args: ["serve", "--profile", "nlt-project-docs"]
    default_enabled: false
    tool_count: 29
    eager_count: 0
    skills: []
    hooks:
      - tapps-post-docs-validate
    tools:
      eager: []
      deferred:
        - docs_session_start
        - docs_project_scan
        - docs_check_drift
        - docs_generate_readme
        - docs_check_completeness
        - docs_check_links
        - docs_config
        - docs_module_map
        - docs_api_surface
        - docs_git_summary
        - docs_generate_api
        - docs_generate_adr
        - docs_generate_onboarding
        - docs_generate_contributing
        - docs_generate_runbook
        - docs_generate_postmortem
        - docs_generate_prd
        - docs_generate_diagram
        - docs_generate_architecture
        - docs_generate_llms_txt
        - docs_generate_frontmatter
        - docs_generate_interactive_diagrams
        - docs_generate_purpose
        - docs_generate_doc_index
        - docs_check_freshness
        - docs_check_diataxis
        - docs_check_cross_refs
        - docs_check_style
        - docs_kg_query

  nlt-release-ship:
    display_name: "Release & Ship"
    tagline: "Changelog, release notes, release gates, and pre-ship CVE checks."
    package: tapps-platform
    serve_command: tapps-platform
    serve_args: ["serve", "--profile", "nlt-release-ship"]
    default_enabled: false
    tool_count: 6
    eager_count: 5
    skills:
      - linear-release-update
    hooks: []
    tools:
      eager:
        - docs_generate_changelog
        - docs_generate_release_update
        - docs_validate_release_update
        - docs_release_gate
        - tapps_release_update
      deferred:
        - docs_generate_release_notes
    notes: |
      CVE scanning (`tapps_dependency_scan`) lives on nlt-build (deferred). Release
      ship covers changelog, release gate, and Linear release-update workflow.

  nlt-setup:
    display_name: "Setup"
    tagline: "Bootstrap, upgrade, diagnose, and observe TappsMCP in your project."
    package: tapps-mcp
    serve_command: tapps-mcp
    serve_args: ["serve", "--profile", "nlt-setup"]
    legacy_profile_alias: nlt-platform-admin
    default_enabled: false
    tool_count: 8
    eager_count: 1
    skills:
      - tapps-init
      - tapps-upgrade
      - tapps-doctor
      - tapps-engagement
      - tapps-tool-reference
    hooks:
      - tapps-session-start
      - tapps-stop
      - tapps-task-completed
      - tapps-user-prompt-submit
    tools:
      eager:
        - tapps_session_start # bootstrap routing (intentional dupe with build/memory)
      deferred:
        - tapps_doctor
        - tapps_server_info
        - tapps_init
        - tapps_upgrade
        - tapps_set_engagement_level
        - tapps_pipeline
        - tapps_stats
    notes: |
      No _tapps_* prompts / tapps:// resources (owned by nlt-build).

# ---------------------------------------------------------------------------
# Cross-server workflows (skills — NOT duplicate tool registration)
# ---------------------------------------------------------------------------
cross_server_workflows:
  linear-release-update:
    primary_server: nlt-release-ship
    optional_servers:
      - nlt-linear-issues # for tapps_linear_snapshot_invalidate after save_document
    steps:
      - tool: tapps_release_update
        server: nlt-release-ship
      - tool: docs_validate_release_update
        server: nlt-release-ship
        note: "Called in-process by tapps_release_update; agent may skip direct call"
      - plugin: linear.save_document
      - tool: tapps_linear_snapshot_invalidate
        server: nlt-linear-issues
        optional: true

  linear-issue:
    primary_server: nlt-linear-issues
    requires_plugin: linear

  tapps-finish-task:
    primary_server: nlt-build
    optional_servers:
      - nlt-memory
    cli_fallback:
      - "tapps-mcp validate-changed --file-paths ..."
      - "tapps-mcp memory save ..."

# ---------------------------------------------------------------------------
# Legacy compatibility (backward compat during migration)
# ---------------------------------------------------------------------------
legacy:
  tapps-mcp:
    maps_to_profile: full
    serve_args: ["serve", "--profile", "full"]
  docs-mcp:
    maps_to_profile: full
    serve_args: ["serve", "--profile", "full"]
  tapps-platform:
    maps_to_profile: full
    serve_args: ["serve", "--profile", "full"]
  deprecation_note: |
    Monolithic servers remain available as --profile full for one release cycle.
    tapps_init vNext writes nlt-* server entries from default_bundles.developer.

# ---------------------------------------------------------------------------
# tapps_init mcp.json template (fragment)
# ---------------------------------------------------------------------------
mcp_json_template:
  mcpServers:
    nlt-build:
      command: uv
      args: ["run", "tapps-mcp", "serve", "--profile", "nlt-build"]
    nlt-memory:
      command: uv
      args: ["run", "tapps-mcp", "serve", "--profile", "nlt-memory"]
    nlt-setup:
      command: uv
      args: ["run", "tapps-mcp", "serve", "--profile", "nlt-setup"]
    nlt-linear-issues:
      command: uv
      args: ["run", "tapps-platform", "serve", "--profile", "nlt-linear-issues"]
    nlt-project-docs:
      command: uv
      args: ["run", "docsmcp", "serve", "--profile", "nlt-project-docs"]
    nlt-release-ship:
      command: uv
      args: ["run", "tapps-platform", "serve", "--profile", "nlt-release-ship"]

# ---------------------------------------------------------------------------
# Verification (CI / tapps_doctor)
# -------------------------------------------------------------------
verification:
  unique_tool_count: 78
  total_registrations: 78
  duplicate_tools: []
  unassigned_tools: []
  per_server_budget_ok: true # all servers <= max_tools_per_server
