llm_engagement_level: medium
skill_tier: full
cursor_stop_completion_gate: warn
mcp_bundle: full
quality_preset: standard
install_git_hooks: true
docs_via_brain: true
linear_team: TAP
linear_project: TappsMCP Platform
# Fat monorepo + skill_tier: full (ADR-0031) — accept live always-on surfaces.
doctor_context_budget:
  claude_md_max_bytes: 16384
  agents_md_max_bytes: 28672
  skill_count_max: 40
  skill_body_max_lines: 120
memory_hooks:
  auto_recall:
    recall_keys:
    - tapps-mcp-nlt-bundle-preference
    - tapps-mcp-nlt-memory-httpcore-fix
memory:
  brain_project_id: tapps-mcp
  brain_http_url: http://localhost:8080
  brain_profile: full
  profile: repo-brain
linear_enforce_gate: true
thresholds:
  overall: 70
  security_floor: 50
max_memories: 1500
gc_auto_threshold: 0.8
memory_decay_enabled: true
adaptive:
  enabled: true
security:
  content_safety: true
  secret_scanning: true
experts:
  auto_generate: true
cache_max_mb: 100
mcp_transport: http
